# Production overrides. Usage:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# Put a TLS-terminating proxy or load balancer in front of port 8080 (HSTS is set there).
services:
  postgres:
    ports: !reset []
    restart: always
  redis:
    ports: !reset []
    restart: always
  backend:
    environment:
      VERITAS_ENV: production
      VERITAS_LOG_LEVEL: INFO
    restart: always
  celery-worker:
    environment:
      VERITAS_ENV: production
    restart: always
  nginx:
    restart: always
