# Included by every location in nginx.conf. Nginx drops server-level add_header lines in any
# location that sets its own, so each location includes this file instead.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
# Only over HTTPS (the TLS proxy in front sets X-Forwarded-Proto); empty means not sent.
add_header Strict-Transport-Security $veritas_hsts always;
