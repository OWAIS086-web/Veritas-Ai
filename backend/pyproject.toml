[project]
name = "veritas-backend"
version = "0.1.0"
description = "VERITAS AI backend: FastAPI modular monolith and Celery workers"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "email-validator>=2.2",
  "sqlalchemy[asyncio]>=2.0.32",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "redis>=5.0",
  "celery[redis]>=5.4",
  "pyjwt>=2.9",
  "argon2-cffi>=23.1",
  "pymupdf>=1.24",
  "numpy>=1.26",
  "python-docx>=1.1",
  "openpyxl>=3.1",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
  "boto3>=1.35",
  "opencv-contrib-python==4.10.0.84",
  "rapidfuzz>=3.9",
  "neo4j>=5.26,<6",
]

[project.optional-dependencies]
ocr = [
    "paddleocr>=3.0",
    "paddlepaddle>=3.0",
]
layout = [
    "docling>=2.15",
    "torch>=2.4",
    "torchvision>=0.19",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=1.0",
  "httpx>=0.27",
  "hypothesis>=6.112",
  "ruff>=0.6",
  "mypy>=1.11",
  "celery-types>=0.22",
  "boto3-stubs[s3]>=1.35",
]

[tool.uv]
package = false
# Docling's default OCR engine (rapidocr) is never used: Docling runs with do_ocr=False and
# PaddleOCR handles scans. Dropping it keeps a single OpenCV build (rapidocr pulls
# opencv-python-headless, which overwrites the cv2 package from opencv-contrib-python).
override-dependencies = ["rapidocr; sys_platform == 'never'"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF"]
ignore = ["B008"]  # FastAPI Depends() in defaults is idiomatic

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
"migrations/**" = ["S608"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["app"]

[[tool.mypy.overrides]]
module = ["celery.*", "kombu.*", "openpyxl.*", "paddleocr.*", "docling.*", "docx.*"]
ignore_missing_imports = true

# PyMuPDF ships no type hints; its calls are confined to the parsing and sample modules.
[[tool.mypy.overrides]]
module = [
  "app.services.parsing.pdf",
  "app.services.forensics.imaging",
  "app.services.forensics.pdf_structure",
]
disallow_untyped_calls = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
# Live provider tests are deselected by default and run on their own: `pytest -m live`.
addopts = "-m 'not live'"
markers = [
  "integration: needs real PostgreSQL and Redis (Docker)",
  "live: calls a real model provider; reported separately",
  "slow: runs OCR or layout models (seconds per test)",
]

# The worker image is CPU-only: on Linux, take torch from the official CPU wheel index
# (PyPI's Linux wheels bundle ~3 GB of CUDA libraries the worker never uses).
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
